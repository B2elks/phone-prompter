<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone Prompter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Svensk text-TV:s disciplin: rena mättade färger på äkta svart, där
   färgen bär information i stället för att dekorera. */
:root {
  --botten: #000000;
  --fast: #ffffff;        /* ordet är fastställt */
  --preliminar: #00e5ff;  /* kan fortfarande ändras */
  --rattad: #ffd600;      /* ändrades nyss */
  --historik: #3a3a3a;
  --rad: #1a1a1a;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--botten);
  color: var(--fast);
  font-family: "Familjen Grotesk", system-ui, sans-serif;
  overflow: hidden;
}

body {
  display: grid;
  grid-template-rows: 1fr auto auto auto auto;
  padding: 4vh 5vw 0;
}

/* Tidigare fraser glider uppåt och tonar bort — de är sagda, inte borta. */
#historik {
  align-self: end;
  overflow: hidden;
  font-size: clamp(.95rem, 1.6vw, 1.45rem);
  font-weight: 400;
  line-height: 1.45;
  color: var(--historik);
  max-width: 46ch;
  mask-image: linear-gradient(to bottom, transparent, #000 45%);
}
#historik p { margin: 0 0 .5em; }

/* Den aktuella frasen är skärmens enda riktiga tyngdpunkt. */
#aktuell {
  font-size: clamp(2rem, 5vw, 4.6rem);
  font-weight: 700;
  line-height: 1.12;
  letter-spacing: -0.02em;
  max-width: 26ch;
  padding: 3vh 0 3vh;
  min-height: 1.3em;
}

/* Ett fysiskt uttryck genom hela skärmen: ett osäkert ord är hett och löst
   — det glöder och sitter glest. När frasen är fastställd slocknar glöden
   och bokstäverna knäpper ihop. Rörelsen bär betydelsen, den dekorerar inte. */
.ord {
  display: inline-block;
  margin-right: .26em;
  white-space: pre;
  color: var(--preliminar);
  letter-spacing: .05em;
  text-shadow: 0 0 .32em rgba(0, 229, 255, .55);
  transition: color .2s ease, letter-spacing .34s cubic-bezier(.34, 1.56, .3, 1),
              text-shadow .3s ease;
}

/* Bokstäverna kaskadar in i stället för att hela ordet dyker upp på en gång. */
.tkn {
  display: inline-block;
  opacity: 0;
  animation: tkn-in .34s cubic-bezier(.2, .8, .25, 1) forwards;
}
@keyframes tkn-in {
  from { opacity: 0; filter: blur(8px); transform: translateY(.22em) scaleX(.7); }
  60%  { opacity: 1; }
  to   { opacity: 1; filter: blur(0);   transform: none; }
}

/* Fastställt: glöden slocknar och spärren dras ihop med en fjädring. */
.ord.fast {
  color: var(--fast);
  letter-spacing: -0.025em;
  text-shadow: none;
}

/* Ett ord som ersatte ett annat blinkar gult innan det lägger sig. */
.ord.rattad { animation: ratta .55s ease forwards; }
@keyframes ratta {
  0%   { color: var(--rattad); text-shadow: 0 0 .5em rgba(255, 214, 0, .7); }
  100% { color: var(--preliminar); text-shadow: 0 0 .32em rgba(0, 229, 255, .55); }
}

/* Tomt läge. En svart skärm går inte att skilja från en trasig sida. */
#tomt {
  margin: 0;
  padding: 0 0 3vh;
  font-size: clamp(1rem, 1.9vw, 1.6rem);
  font-weight: 400;
  color: #7a7a7a;
  max-width: 40ch;
}
#tomt[hidden] { display: none; }

/* Syns bara när fliken har fokus och utskriften därför pausar. */
#fokusnotis {
  margin: 0;
  padding: 0 0 1.4vh;
  font-size: clamp(.85rem, 1.4vw, 1.1rem);
  color: var(--rattad);
  max-width: 44ch;
}
#fokusnotis[hidden] { display: none; }

#status {
  border-top: 1px solid var(--rad);
  padding: 1.1rem 0 1.4rem;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: .82rem;
  font-weight: 500;
  color: #6b6b6b;
}
#lage { color: var(--fast); }
#lage[data-lyssnar="nej"] { color: #6b6b6b; }
#prick {
  display: inline-block;
  width: .5em; height: .5em;
  border-radius: 50%;
  background: #333;
  margin-right: .55em;
  vertical-align: baseline;
}
#lage[data-lyssnar="ja"] #prick { background: var(--preliminar); }

@media (prefers-reduced-motion: reduce) {
  .ord, .ord.fast, .ord.rattad, .tkn {
    animation: none;
    transition: none;
    opacity: 1;
    filter: none;
    transform: none;
  }
}
</style>
</head>
<body>

<div id="historik"></div>
<div id="aktuell" aria-live="polite"></div>
<p id="tomt">Lyft luren och prata. Orden dyker upp här.</p>
<p id="fokusnotis" hidden>Texten knappas inte in medan det här fönstret är
framme. Klicka i programmet du skriver i.</p>

<div id="status">
  <span id="lage" data-lyssnar="nej"><span id="prick"></span>väntar på ljud</span>
  <span id="kalla"></span>
</div>

<script>
const aktuell = document.getElementById("aktuell");
const historik = document.getElementById("historik");
const lage = document.getElementById("lage");
const kalla = document.getElementById("kalla");

let visade = [];   // orden som redan står på skärmen
const tomt = document.getElementById("tomt");

function visa_tomt_lage() {
  tomt.hidden = aktuell.children.length > 0 || historik.children.length > 0;
}

/** Ritar om frasen men rör inte ord som redan landat — annars skulle
 *  varje uppdatering starta om alla animationer. */
function rita(ord, fastslagen) {
  let gemensam = 0;
  while (gemensam < ord.length && gemensam < visade.length &&
         ord[gemensam] === visade[gemensam]) gemensam++;

  // Ord som ändrades tas bort; de var preliminära och blev något annat.
  while (aktuell.children.length > gemensam) aktuell.lastChild.remove();

  for (let i = gemensam; i < ord.length; i++) {
    const s = document.createElement("span");
    s.className = "ord";
    // Varje tecken får sin egen fördröjning så ordet rullar in.
    [...ord[i]].forEach((tecken, j) => {
      const t = document.createElement("span");
      t.className = "tkn";
      t.textContent = tecken;
      t.style.animationDelay = (j * 26) + "ms";
      s.appendChild(t);
    });
    // Ett ord som ersätter ett annat markeras som rättat.
    if (i < visade.length && visade[i] !== ord[i]) s.classList.add("rattad");
    aktuell.appendChild(s);
  }
  visade = ord.slice();
  visa_tomt_lage();

  if (fastslagen) {
    [...aktuell.children].forEach((s, i) => {
      setTimeout(() => s.classList.add("fast"), i * 45);
    });
  }
}

function arkivera(text) {
  if (text) {
    const p = document.createElement("p");
    p.textContent = text;
    historik.appendChild(p);
    while (historik.children.length > 6) historik.firstChild.remove();
    historik.scrollTop = historik.scrollHeight;
  }
  aktuell.replaceChildren();
  visade = [];
  visa_tomt_lage();
}

/* Säg till bryggan när den här fliken har tangentbordsfokus. Annars
   knappas texten in här i stället för i programmet du arbetar i.
   Pingas medan fokus ligger kvar, så en stängd flik inte låser utskriften. */
let fokusping = null;
function meddela_fokus(pa) {
  fetch("/fokus?pa=" + (pa ? 1 : 0), {keepalive: true}).catch(() => {});
  const notis = document.getElementById("fokusnotis");
  if (notis) notis.hidden = !pa;
  clearInterval(fokusping);
  if (pa) fokusping = setInterval(() => meddela_fokus(true), 3000);
}
addEventListener("focus", () => meddela_fokus(true));
addEventListener("blur", () => meddela_fokus(false));
addEventListener("pagehide", () => meddela_fokus(false));
document.addEventListener("visibilitychange",
  () => meddela_fokus(document.visibilityState === "visible" && document.hasFocus()));
meddela_fokus(document.hasFocus());

const strom = new EventSource("/handelser");

strom.addEventListener("preliminar", e => {
  rita(JSON.parse(e.data).text.split(/\s+/).filter(Boolean), false);
});

strom.addEventListener("slutlig", e => {
  const text = JSON.parse(e.data).text;
  rita(text.split(/\s+/).filter(Boolean), true);
  setTimeout(() => arkivera(text), 1400);
});

strom.addEventListener("lage", e => {
  const d = JSON.parse(e.data);
  lage.dataset.lyssnar = d.lyssnar ? "ja" : "nej";
  lage.lastChild.textContent = d.lyssnar ? "lyssnar" : "väntar på ljud";
  if (d.kalla) kalla.textContent = d.kalla;
});

strom.onerror = () => {
  lage.dataset.lyssnar = "nej";
  lage.lastChild.textContent = "ingen kontakt med bryggan";
};
</script>
</body>
</html>
